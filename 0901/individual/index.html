<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교육자료 신청 및 만족도 조사</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      padding: 40px 32px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--border-color);
    }

    /* QR 코드 상단 세션 */
    .qr-container {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px;
      background-color: #f1f5f9;
      border-radius: 12px;
      border: 1px dashed #cbd5e1;
    }

    .qr-container img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      background-color: #ffffff;
      padding: 8px;
    }

    .qr-container p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 10px;
      font-weight: 500;
    }

    /* PR 배너 영역 */
    .pr-banner {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 24px;
    }

    .pr-banner h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .pr-banner p {
      font-size: 13px;
      opacity: 0.9;
      line-height: 1.4;
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    .header h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #334155;
    }

    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      background-color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      background-color: #a5b4fc;
      cursor: not-allowed;
    }

    /* 완료 화면 */
    .success-card {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      background-color: #e0e7ff;
      color: var(--primary-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 32px;
    }

    .success-card h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .success-card p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 맨 위 QR 코드 영역 -->
    <div class="qr-container">
      <!-- 동적 QR 생성 API로 대체하여 잘림 현상을 완전 방지 -->
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://script.google.com" alt="스캔용 QR 코드">
      <p>스마트폰 카메라로 스캔하여 신청 페이지에 접속하세요.</p>
    </div>

    <!-- PR 배너 영역 -->
    <div class="pr-banner">
      <h1>🎓 2026 교육자료 신청 페이지</h1>
      <p>수강생 여러분의 학습 지원을 위한 공식 자료 제공 채널입니다.</p>
    </div>

    <!-- 신청/설문 폼 -->
    <form id="applyForm">
      <div class="header">
        <h2>교육자료 신청 및 만족도 조사</h2>
        <p>양식을 작성해주시면 입력하신 이메일로 자료를 보내드립니다.</p>
      </div>

      <div class="form-group">
        <label for="userName">신청자명</label>
        <input type="text" id="userName" name="userName" placeholder="홍길동" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="department">소속 / 학과</label>
          <input type="text" id="department" name="department" placeholder="컴퓨터공학과" required>
        </div>
        <div class="form-group">
          <label for="studentId">학번 / 사번</label>
          <input type="text" id="studentId" name="studentId" placeholder="20261234" required>
        </div>
      </div>

      <div class="form-group">
        <label for="userEmail">연락처 이메일</label>
        <input type="email" id="userEmail" name="userEmail" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label for="satisfaction">강의 만족도</label>
        <select id="satisfaction" name="satisfaction" required>
          <option value="" disabled selected>만족도를 선택해주세요</option>
          <option value="매우 만족">매우 만족</option>
          <option value="만족">만족</option>
          <option value="보통">보통</option>
          <option value="아쉬움">아쉬움</option>
        </select>
      </div>

      <div class="form-group">
        <label for="desiredTopic">추가로 다뤄주었으면 하는 주제 (선택)</label>
        <input type="text" id="desiredTopic" name="desiredTopic" placeholder="예: 심화 프로젝트 실습, 오픈소스 활용법 등">
      </div>

      <div class="form-group">
        <label for="message">교수님께 전하는 메시지</label>
        <textarea id="message" name="message" placeholder="교수님께 하시고 싶은 말씀이나 질문을 적어주세요."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">확인 및 제출하기</button>
    </form>

    <!-- 완료 메시지 화면 -->
    <div class="success-card" id="successCard">
      <div class="success-icon">✓</div>
      <h3>오늘 교육 받느라 수고하셨습니다.</h3>
      <p>신청이 성공적으로 완료되었습니다.<br>입력하신 이메일로 자료가 전달될 예정입니다.</p>
    </div>
  </div>

  <script>
    document.getElementById('applyForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '제출 중...';

      const formData = {
        userName: document.getElementById('userName').value,
        department: document.getElementById('department').value,
        studentId: document.getElementById('studentId').value,
        userEmail: document.getElementById('userEmail').value,
        satisfaction: document.getElementById('satisfaction').value,
        desiredTopic: document.getElementById('desiredTopic').value,
        message: document.getElementById('message').value
      };

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === 'success') {
            document.getElementById('applyForm').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
          } else {
            alert('오류가 발생했습니다: ' + response.message);
            submitBtn.disabled = false;
            submitBtn.innerText = '확인 및 제출하기';
          }
        })
        .withFailureHandler(function(err) {
          alert('제출에 실패했습니다. 다시 시도해 주세요.');
          submitBtn.disabled = false;
          submitBtn.innerText = '확인 및 제출하기';
        })
        .submitData(formData);
    });
  </script>
</body>
</html>
