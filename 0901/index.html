            <table class="w-full min-w-[560px] border-collapse" id="timeGrid"></table>
          </div>
        </div>
        <p class="font-label-sm text-label-sm text-on-surface-variant text-right">가로로 스크롤하여 더 많은 요일을 확인하세요.</p>
      </div>

      <div class="space-y-base">
        <label class="block font-label-sm text-label-sm text-on-surface" for="clubActivity">동아리 활동 내용 <span class="text-error">*</span></label>

      </div>

      <div class="space-y-base">
        <label class="block font-label-sm text-label-sm text-on-surface" for="note">비고 <span class="text-on-surface-variant font-normal">(선택)</span></label>
        <textarea class="w-full p-md bg-surface-container-lowest border border-[#E1E4E8] rounded-lg focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors font-body-lg text-body-lg text-on-surface resize-none placeholder:text-on-surface-variant/50" id="note" placeholder="예) 화요일은 저녁 8시 이후만 가능해요" rows="2"></textarea>

             alt="설문 공유 QR코드"/>

  <!-- ===== 완료 화면 ===== -->
  <div id="doneView" class="hidden">

      <div class="success-icon w-24 h-24 bg-primary-container rounded-full flex items-center justify-center mb-lg shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
        <span class="material-symbols-outlined text-[48px] text-on-primary font-bold">check</span>

    </main>

<script>
  // ▼ 요일/시간대 구성을 바꾸고 싶으면 이 배열만 수정하면 됩니다 ▼
  var DAYS = ['월', '화', '수', '목', '금', '토', '일'];
  var WEEKEND_DAYS = ['토', '일'];
  var TIME_BLOCKS = ['09:00~12:00', '12:00~15:00', '15:00~18:00', '18:00~21:00', '21:00~24:00'];

  function buildGrid() {
    var table = document.getElementById('timeGrid');

    var thead = document.createElement('thead');
    var headRow = document.createElement('tr');
    headRow.className = 'border-b border-surface-variant bg-surface-container-low/50';
    var cornerTh = document.createElement('th');
    cornerTh.className = 'p-2 w-20 font-label-caps text-label-caps text-on-surface-variant text-center border-r border-surface-variant';
    cornerTh.textContent = '시간';
    headRow.appendChild(cornerTh);
    DAYS.forEach(function (d) {
      var th = document.createElement('th');
      var isWeekend = WEEKEND_DAYS.indexOf(d) !== -1;
      th.className = 'p-2 min-w-[60px] font-label-caps text-label-caps text-center ' + (isWeekend ? 'text-error' : 'text-on-surface');
      th.textContent = d;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    TIME_BLOCKS.forEach(function (time) {
      var tr = document.createElement('tr');
      tr.className = 'border-b border-surface-variant last:border-b-0';

      var timeTd = document.createElement('td');
      timeTd.className = 'p-2 text-center font-label-caps text-[10px] text-on-surface-variant border-r border-surface-variant bg-surface-container-low/20 whitespace-pre-line';
      timeTd.textContent = time.replace('~', '\n~ ');
      tr.appendChild(timeTd);

      DAYS.forEach(function (day, i) {
        var td = document.createElement('td');
        td.className = 'p-1 cursor-pointer' + (i < DAYS.length - 1 ? ' border-r border-surface-variant/50' : '');

        var cell = document.createElement('div');
        cell.className = 'grid-cell w-full h-12 rounded bg-surface-container-lowest border border-[#E1E4E8] flex items-center justify-center transition-colors hover:bg-surface-container-low';
        cell.setAttribute('data-day', day);
        cell.setAttribute('data-time', time);
        cell.addEventListener('click', function () { toggleCell(cell); });

        td.appendChild(cell);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
  }
  buildGrid();

  function toggleCell(cell) {
    cell.classList.toggle('selected');
    if (cell.classList.contains('selected')) {
      cell.innerHTML = '<span class="material-symbols-outlined text-[20px]">check</span>';
    } else {
      cell.innerHTML = '';
    }
  }

  function getSelectedSlots() {
    var cells = document.querySelectorAll('#timeGrid .grid-cell.selected');
    var result = [];
    cells.forEach(function (c) {
      result.push(c.getAttribute('data-day') + ' ' + c.getAttribute('data-time'));
    });
    return result;
  }

  var checkTimer = null;
  document.getElementById('studentId').addEventListener('input', function () {
    var hint = document.getElementById('idHint');
    hint.className = 'font-label-sm text-label-sm flex items-center gap-1 min-h-[16px]';
    hint.innerHTML = '';
    clearTimeout(checkTimer);
    var val = this.value.trim();
    if (val.length < 4) return;
    checkTimer = setTimeout(function () {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.duplicated) {
            hint.className = 'font-label-sm text-label-sm flex items-center gap-1 min-h-[16px] text-error';
            hint.innerHTML = '<span class="material-symbols-outlined text-[14px]">cancel</span> 이미 이번 회차에 제출한 학번입니다';
          } else {
            hint.className = 'font-label-sm text-label-sm flex items-center gap-1 min-h-[16px] text-[#1F8B5A]';
            hint.innerHTML = '<span class="material-symbols-outlined text-[14px]">check_circle</span> 제출 가능한 학번입니다';
          }
        })
        .withFailureHandler(function () {})
        .checkStudentId(val);
    }, 450);
  });

  function showAlert(msg) {
    document.getElementById('alertText').textContent = msg;
    document.getElementById('alertBox').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function hideAlert() {
    document.getElementById('alertBox').classList.add('hidden');
  }

  function copyShareLink() {
    var link = document.getElementById('shareLink').textContent.trim();
    var icon = document.getElementById('copyIcon');
    var done = function () {
      icon.textContent = 'check';
      setTimeout(function () { icon.textContent = 'content_copy'; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done).catch(function () {});
    } else {
      var ta = document.createElement('textarea');
      ta.value = link;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  function handleSubmit() {
    hideAlert();

    var data = {
      studentId: document.getElementById('studentId').value.trim(),
      name: document.getElementById('name').value.trim(),
      timeSlots: getSelectedSlots(),
      note: document.getElementById('note').value.trim(),
      clubActivity: document.getElementById('clubActivity').value.trim()
    };

    if (!data.studentId) { showAlert('학번을 입력해 주세요.'); return; }
    if (!data.name)      { showAlert('이름을 입력해 주세요.'); return; }
    if (data.timeSlots.length === 0) { showAlert('가능한 시간대를 1개 이상 선택해 주세요.'); return; }
    if (!data.clubActivity) { showAlert('동아리 활동 내용을 입력해 주세요.'); return; }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '제출 중...';

    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok) {
          document.getElementById('doneMsg').textContent = res.message || '참여해 주셔서 감사합니다!';
          document.getElementById('formView').classList.add('hidden');
          document.getElementById('doneView').classList.remove('hidden');
          window.scrollTo(0, 0);
        } else {
          showAlert((res && res.message) || '제출에 실패했습니다. 다시 시도해 주세요.');
          btn.disabled = false;
          btn.textContent = '확인';
        }
      })
      .withFailureHandler(function (err) {
        showAlert('서버 오류가 발생했습니다: ' + err.message);
        btn.disabled = false;
        btn.textContent = '확인';
      })
      .submitForm(data);
  }
</script>
</body>
