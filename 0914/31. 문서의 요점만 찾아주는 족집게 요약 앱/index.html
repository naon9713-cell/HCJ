<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서 요약기 · TextRank</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>📄 TextRank 문서 요약기</h1>
      <p class="subtitle">PDF · DOCX 문서를 업로드하면 TextRank 알고리즘으로 핵심 문장만 뽑아드려요</p>
    </header>

    <main>
      <!-- 1. 업로드 화면 -->
      <section id="upload-screen" class="screen active">
        <div id="dropzone" class="dropzone">
          <div class="dropzone-icon">📁</div>
          <p class="dropzone-text"><strong>클릭하여 파일 선택</strong> 또는 파일을 이곳에 끌어다 놓으세요</p>
          <p class="dropzone-sub">지원 형식: PDF, DOCX (최대 50MB)</p>
          <input type="file" id="file-input" accept=".pdf,.docx" hidden>
        </div>
        <p id="upload-error" class="error-msg" hidden></p>
      </section>

      <!-- 2. 분석 중 화면 -->
      <section id="loading-screen" class="screen">
        <div class="spinner"></div>
        <p id="loading-text">문서를 분석하고 있어요...</p>
      </section>

      <!-- 3. 결과 화면 -->
      <section id="result-screen" class="screen">
        <div class="file-meta">
          <div class="file-meta-icon" id="file-type-icon">📄</div>
          <div class="file-meta-info">
            <div id="file-name" class="file-name">document.pdf</div>
            <div id="file-stats" class="file-stats">문장 0개 · 단어 0개</div>
          </div>
          <button id="reset-btn" class="btn btn-ghost">🔄 다른 파일</button>
        </div>

        <div class="control-panel">
          <div class="slider-row">
            <label for="sentence-slider">요약 분량</label>
            <div class="slider-wrap">
              <input type="range" id="sentence-slider" min="1" max="5" step="1" value="3">
              <span id="slider-value-badge">3문장</span>
            </div>
          </div>
          <div class="preset-row" id="preset-row">
            <button class="preset-btn" data-value="1">1문장</button>
            <button class="preset-btn active" data-value="3">3문장</button>
            <button class="preset-btn" data-value="5">5문장</button>
          </div>
        </div>

        <div class="summary-box">
          <h2>✨ 요약 결과</h2>
          <ol id="summary-list" class="summary-list"></ol>
          <button id="copy-btn" class="btn btn-secondary">📋 요약 복사하기</button>
          <span id="copy-toast" class="copy-toast" hidden>복사되었습니다!</span>
        </div>

        <details class="original-details">
          <summary>📃 원문 전체 보기 (핵심 문장 하이라이트)</summary>
          <div id="original-text-view" class="original-text-view"></div>
        </details>
      </section>
    </main>

    <footer class="app-footer">
      <p>모든 분석은 브라우저 안에서만 처리되며 파일이 서버로 전송되지 않습니다.</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="textrank.js"></script>
  <script src="script.js"></script>
</body>
</html>
