<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글자수 세기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📝 글자수 세기</h1>
      <p class="sub">한글은 2byte, 영문·숫자·기호·공백은 1byte로 계산합니다.</p>
    </header>

    <main>
      <textarea id="textInput" placeholder="여기에 텍스트를 입력하세요..."></textarea>

      <div class="stats">
        <div class="stat-card">
          <span class="stat-label">글자 수 (공백 포함)</span>
          <span class="stat-value" id="charCount">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">글자 수 (공백 제외)</span>
          <span class="stat-value" id="charCountNoSpace">0</span>
        </div>
        <div class="stat-card highlight">
          <span class="stat-label">Byte 수 (한글 2byte 기준)</span>
          <span class="stat-value" id="byteCount">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">단어 수</span>
          <span class="stat-value" id="wordCount">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">줄 수</span>
          <span class="stat-value" id="lineCount">0</span>
        </div>
      </div>

      <div class="detail-box">
        <div class="detail-row">
          <span>한글 글자 수</span>
          <span id="koreanCount">0자</span>
        </div>
        <div class="detail-row">
          <span>영문·숫자·기타 글자 수</span>
          <span id="otherCount">0자</span>
        </div>
      </div>

      <button id="clearBtn">🗑️ 전체 지우기</button>
    </main>

    <footer>
      <p>한글(가-힣, 자모)은 2byte, 그 외 모든 문자(영문·숫자·공백·특수문자 등)는 1byte로 계산합니다.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
